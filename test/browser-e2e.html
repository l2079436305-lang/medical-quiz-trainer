<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Browser E2E</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<main class="container">
  <section id="view-home"></section>
  <section id="view-setup" class="hidden"></section>
  <section id="view-quiz" class="hidden"></section>
  <section id="view-result" class="hidden"></section>
  <section id="view-stats" class="hidden"></section>
  <section id="view-import" class="hidden"></section>
</main>
<div id="e2e" style="white-space:pre;font-family:monospace"></div>

<script src="../js/parser.js"></script>
<script src="../js/docx.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/question-bank.js"></script>
<script src="../js/quiz.js"></script>
<script src="../js/statistics.js"></script>
<script src="../js/exporter.js"></script>
<script src="fixtures/real-bank-as-js.js"></script>
<script src="../js/ui/dom.js"></script>
<script src="../js/views/home.js"></script>
<script src="../js/views/setup.js"></script>
<script src="../js/views/quiz.js"></script>
<script src="../js/views/result.js"></script>
<script src="../js/views/stats.js"></script>
<script src="../js/views/import.js"></script>
<script src="../js/app.js"></script>
<script>
(function () {
  var out = [];
  var passed = 0, failed = 0;
  function check(name, cond, detail) {
    if (cond) { passed++; out.push('PASS ' + name); }
    else { failed++; out.push('FAIL ' + name + (detail !== undefined ? ' :: ' + JSON.stringify(detail).slice(0, 150) : '')); }
  }

  try {
    // 1. 导入视图渲染
    App.show('import');
    check('import 视图渲染', document.querySelector('#i-text') !== null);

    // 2. 模拟粘贴真实题库并解析预览
    document.querySelector('#i-text').value = window.REAL_BANK_TEXT;
    document.querySelector('[data-act=parse]').click();
    check('解析预览渲染', document.querySelector('#i-preview').innerHTML.indexOf('成功识别') >= 0);
    check('预览显示 3000 题', document.querySelector('#i-preview').innerHTML.indexOf('3000') >= 0);
    check('病例题干缺失异常被列出', document.querySelector('#i-anomalies').innerHTML.indexOf('病例共用题干缺失') >= 0);
    check('病例补录输入框存在', document.querySelector('#i-anomalies [data-f=casestem]') !== null);

    // 2b. 补录一个病例题干 → 全组生效（导入后验证）
    var stemInput = document.querySelector('#i-anomalies [data-f=casestem]');
    stemInput.value = '男，45岁。突发胸痛2小时，心电图示Ⅱ、Ⅲ、aVF导联ST段抬高。';
    document.querySelector('#i-anomalies [data-fix][data-case="1"]').click();
    check('病例补录按钮生效', document.querySelector('#i-anomalies [data-fix][data-case="1"]').disabled === true);

    // 3. 确认导入
    document.querySelector('[data-act=confirm-import]').click();
    check('导入后题库 3000', MQBank.size() === 3000, MQBank.size());
    check('病例补录后组内成员获得题干', MQBank.state.questions.some(function (q) { return q.caseId && q.caseStem.indexOf('突发胸痛') >= 0; }));

    // 4. 首页渲染
    App.show('home');
    var homeHtml = document.querySelector('#view-home').innerHTML;
    check('首页主按钮', homeHtml.indexOf('开始随机练习') >= 0);
    check('首页错题强化', homeHtml.indexOf('错题强化') >= 0);
    check('首页章节练习', homeHtml.indexOf('章节练习') >= 0);

    // 5. 设置页渲染
    App.show('setup', { chapter: '第一章 解剖学' });
    check('设置页章节选项', document.querySelector('#s-chapter').innerHTML.indexOf('第一章 解剖学') >= 0);
    check('范围提示', document.querySelector('#s-pool-info').textContent.indexOf('30') >= 0, document.querySelector('#s-pool-info').textContent);

    // 6. 直接开始一场练习（走 UI 渲染路径）
    var session = MQQuiz.createSession({ specialPool: 'all', chapter: '第一章 解剖学' }, { count: 20 });
    MQViews.quiz.setSession(session);
    App.show('quiz');
    var quizHtml = document.querySelector('#view-quiz').innerHTML;
    check('答题页渲染题干', quizHtml.indexOf('腹股沟管深环') >= 0 || quizHtml.length > 500);
    check('答题页 5 个选项', document.querySelectorAll('#opt-box .option').length === 5, document.querySelectorAll('#opt-box .option').length);
    check('答题卡 20 格', document.querySelectorAll('.palette button').length === 20);

    // 6b. 病例题渲染路径（带共用题干）
    var caseQ = MQBank.state.questions.filter(function (q) { return q.caseId && q.caseStem; })[0];
    if (caseQ) {
      var caseSession = { id: 999, label: '病例测试', submitted: false, index: 0, answers: {}, flags: {},
        meta: {}, questions: [{ uid: caseQ.uid, options: Object.keys(caseQ.options).map(function (L) { return { letter: L, text: caseQ.options[L] }; }) }] };
      MQViews.quiz.setSession(caseSession);
      App.show('quiz');
      var cq = MQBank.get(caseSession.questions[0].uid);
      check('病例题显示共用题干框', document.querySelector('#view-quiz .case-stem') !== null);
      check('病例题显示序号徽标', document.querySelector('#view-quiz').innerHTML.indexOf('病例题 第 1 / ' + caseQ.caseTotal + ' 问') >= 0, document.querySelector('#view-quiz').innerHTML.indexOf('病例题'));
      App.show('home');
      MQViews.quiz.setSession(session);
      App.show('quiz');
    }

    // 7. 模拟点选选项 → 答案保存
    var opt = document.querySelector('#opt-box .option input');
    opt.checked = true;
    opt.dispatchEvent(new Event('change', { bubbles: true }));
    var uid = session.questions[0].uid;
    check('点选保存答案', (session.answers[uid] || '').length === 1, session.answers[uid]);

    // 8. 翻页
    document.querySelector('[data-nav2=next]').click();
    check('下一题', document.querySelector('#view-quiz .quiz-head strong').textContent.indexOf('2 / 20') >= 0, document.querySelector('#view-quiz .quiz-head strong').textContent);

    // 9. 交卷并渲染结果
    var summary = MQQuiz.submitSession(session);
    App.showResult(session, summary);
    var resultHtml = document.querySelector('#view-result').innerHTML;
    check('结果页判分', resultHtml.indexOf('正确率') >= 0);
    check('结果页逐题回顾', document.querySelectorAll('#result-list .result-item').length === 20, document.querySelectorAll('#result-list .result-item').length);
    check('结果页显示正确答案', resultHtml.indexOf('正确答案') >= 0);

    // 10. 统计页渲染
    App.show('stats');
    var statsHtml = document.querySelector('#view-stats').innerHTML;
    check('统计页章节表', statsHtml.indexOf('第一章 解剖学') >= 0);
    check('统计页错题本', statsHtml.indexOf('错题本') >= 0);
    check('统计页历史', statsHtml.indexOf('历史练习') >= 0);

    // 11. 隐私检查：无任何外部资源引用
    var external = 0;
    document.querySelectorAll('script[src],link[href],img[src]').forEach(function (n) {
      var u = n.src || n.href || '';
      if (/^https?:/i.test(u)) external++;
    });
    check('零外部资源请求', external === 0, external);

  } catch (e) {
    failed++;
    out.push('FAIL 异常: ' + e.message + '\n' + (e.stack || '').slice(0, 400));
  }

  out.push('========== browser e2e: ' + passed + ' passed, ' + failed + ' failed ==========');
  document.title = failed ? 'E2E-FAIL' : 'E2E-PASS';
  document.querySelector('#e2e').textContent = out.join('\n');
})();
</script>
</body>
</html>
